name: KidsMonitor
options:
  bundleIdPrefix: com.kidsmonitor
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
packages:
  MonitorCore:
    path: .
targets:
  KidsMonitor:
    type: application
    platform: iOS
    sources: [Monitor]
    dependencies:
      - package: MonitorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kidsmonitor.monitor.ios
        INFOPLIST_FILE: Monitor/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  KidsParent:
    type: application
    platform: iOS
    sources:
      - Parent
      - Monitor/HubConnection.swift
      - Monitor/QRScanner.swift
      - Monitor/DeviceName.swift
      - Monitor/AudioCapture.swift
      - Monitor/Assets.xcassets
    dependencies:
      - package: MonitorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kidsmonitor.parent.ios
        INFOPLIST_FILE: Parent/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ParentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ParentUITests]
    dependencies:
      - target: KidsParent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ParentTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ParentTests]
    dependencies:
      - target: KidsParent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MonitorTests]
    dependencies:
      - target: KidsMonitor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KidsMonitor:
    build:
      targets:
        KidsMonitor: all
        MonitorTests: [test]
    test:
      targets: [MonitorTests]

  KidsParent:
    build:
      targets:
        KidsParent: all
        ParentTests: [test]
        ParentUITests: [test]
    test:
      targets: [ParentTests, ParentUITests]
