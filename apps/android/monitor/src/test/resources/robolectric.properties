# The app targets SDK 37; Robolectric 4.16.1 only ships images up to 36, and
# refuses to run when targetSdk exceeds what it supports. Pin the emulated SDK
# here rather than annotating every test class.
#
# Consequence: unit tests exercise API 36 behaviour, not 37. Anything whose
# behaviour actually changed in 37 has to be verified on a device (Task 13).
# Raise this when Robolectric ships a 37 image.
sdk=36
